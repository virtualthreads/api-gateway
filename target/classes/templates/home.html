<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Virtualthreads</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            color: #1f2937;
            min-height: 100vh;
        }

        /* Navigation Bar */
        nav {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 22px;
            font-weight: 600;
            color: #111827;
            text-decoration: none;
        }

        .login-btn {
            text-decoration: none;
            background: #111827;
            color: white;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s ease;
        }

        .login-btn:hover {
            background: #374151;
        }

        /* Main Content */
        main {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .welcome {
            max-width: 600px;
        }

        .welcome h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #111827;
        }

        .welcome p {
            font-size: 18px;
            color: #6b7280;
            line-height: 1.6;
        }

        @media (max-width: 600px) {

            nav {
                padding: 0 20px;
            }

            .welcome h1 {
                font-size: 36px;
            }

            .welcome p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="/" class="logo">Virtualthreads</a>

    <a href="/login" class="login-btn">Login</a>
</nav>

<main>
    <div class="welcome">
        <h1>Welcome to Virtualthreads</h1>

        <p>
            A simple and seamless shopping experience.
        </p>
    </div>
</main>

</body>
</html>
